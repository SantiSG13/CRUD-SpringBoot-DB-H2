<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Cliente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Hoja de estilos estática -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div class="envoltorio-formulario">
        <div class="caja-formulario">
            <h1 class="titulo-principal" style="text-align: center; margin-bottom: 1.5rem;" th:text="${titulo}">Formulario de Cliente</h1>

            <form th:action="@{/Cliente/formulario}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="grupo-campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre" required />
                </div>

                <div class="grupo-campo">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ingrese el apellido" required />
                </div>

                <div class="grupo-campo">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@correo.com" required />
                </div>

                <div class="grupo-botones">
                    <a th:href="@{/Cliente/listar}" class="boton boton-secundario">Cancelar</a>
                    <button type="submit" class="boton boton-principal">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>

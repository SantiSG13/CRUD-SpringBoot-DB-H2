<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Cliente</title>

    <!-- Hoja de estilos estática centralizada -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div class="contenedor-formulario-padre">
        
        <!-- Tarjeta del Formulario -->
        <div class="caja-formulario">
            <h1 class="titulo-pagina titulo-centrado" th:text="${titulo}">Formulario de Cliente</h1>

            <form th:action="@{/Cliente/formulario}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="grupo-input">
                    <label for="nombre" class="etiqueta-input">Nombre</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre" required class="campo-texto" />
                </div>

                <div class="grupo-input">
                    <label for="apellido" class="etiqueta-input">Apellido</label>
                    <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ingrese el apellido" required class="campo-texto" />
                </div>

                <div class="grupo-input">
                    <label for="email" class="etiqueta-input">Correo Electrónico</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@correo.com" required class="campo-texto" />
                </div>

                <!-- Botones del Formulario -->
                <div class="grupo-botones">
                    <a th:href="@{/Cliente/listar}" class="btn btn-secundario boton-medio">Cancelar</a>
                    <button type="submit" class="btn btn-principal boton-medio">Guardar Cliente</button>
                </div>
            </form>
        </div>

    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario de Producto</title>

    <!-- Hoja de estilos estática centralizada -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div class="contenedor-formulario-padre">
        
        <!-- Tarjeta del Formulario -->
        <div class="caja-formulario">
            <h1 class="titulo-pagina titulo-centrado" th:text="${titulo}">Formulario de Producto</h1>

            <form th:action="@{/Producto/formulario}" th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="grupo-input">
                    <label for="nombre" class="etiqueta-input">Nombre del Producto</label>
                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ingrese el nombre del producto" required class="campo-texto" />
                </div>

                <div class="grupo-input-doble">
                    <div class="grupo-input">
                        <label for="precio" class="etiqueta-input">Precio ($)</label>
                        <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}" placeholder="0.00" required class="campo-texto" />
                    </div>
                    <div class="grupo-input">
                        <label for="stock" class="etiqueta-input">Stock</label>
                        <input type="number" min="0" id="stock" th:field="*{stock}" placeholder="Cantidad" required class="campo-texto" />
                    </div>
                </div>

                <div class="grupo-input">
                    <label for="categoria" class="etiqueta-input">Categoría</label>
                    <input type="text" id="categoria" th:field="*{categoria}" placeholder="Ej: Electrónica, Ropa, etc." required class="campo-texto" />
                </div>

                <div class="grupo-input">
                    <label for="descripcion" class="etiqueta-input">Descripción</label>
                    <input type="text" id="descripcion" th:field="*{descripcion}" placeholder="Breve descripción del producto" class="campo-texto" />
                </div>

                <!-- Botones del Formulario -->
                <div class="grupo-botones">
                    <a th:href="@{/Producto/listar}" class="btn btn-secundario boton-medio">Cancelar</a>
                    <button type="submit" class="btn btn-principal boton-medio">Guardar Producto</button>
                </div>
            </form>
        </div>

    </div>
</body>

</html>

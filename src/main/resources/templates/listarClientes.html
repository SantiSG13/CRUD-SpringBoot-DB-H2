<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Listado de Clientes</title>
    <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <!-- Hoja de estilos estática -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>
    <div class="contenedor-principal">
        <h1 class="titulo-principal" th:text="${titulo}">Listado de Clientes</h1>
        <p class="subtitulo-principal">Gestión de usuarios y registros del sistema</p>

        <!-- Vista rápida de Atributos -->
        <ul class="resumen-campos">
            <li>ID</li>
            <li>Nombre</li>
            <li>Apellido</li>
            <li>Email</li>
            <li>Fecha de Creación</li>
        </ul>

        <!-- Botones de Acción -->
        <div style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <a th:href="@{/Producto/listar}" class="boton boton-secundario" style="max-width: 180px;">Ver Productos &rarr;</a>
            <a th:href="@{/Cliente/formulario}" class="boton boton-principal" style="max-width: 180px;">+ Crear Cliente</a>
        </div>

        <div class="linea-divisora"></div>

        <!-- Lista de Tarjetas de Clientes -->
        <div style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div class="tarjeta" th:each="cliente : ${clientes}">
                <div class="encabezado-tarjeta">
                    <h2 class="titulo-tarjeta" th:text="${cliente.nombre + ' ' + cliente.apellido}"></h2>
                    <div style="display: flex; align-items: center; gap: 0.8rem;">
                        <span class="etiqueta-id" th:text="${'ID #' + cliente.id}"></span>
                        <a th:href="@{/Cliente/formulario/} + ${cliente.id}" class="boton-editar">Editar</a>
                        <a th:href="@{/Cliente/eliminar/} + ${cliente.id}"
                            onclick="return confirm('¿Seguro que deseas eliminar este cliente?');"
                            class="boton-eliminar">Eliminar</a>
                    </div>
                </div>

                <div class="rejilla-informacion">
                    <div class="bloque-informacion">
                        <span class="etiqueta-campo">Nombre Completo</span>
                        <p class="valor-campo" th:text="${cliente.nombre + ' ' + cliente.apellido}"></p>
                    </div>

                    <div class="bloque-informacion">
                        <span class="etiqueta-campo">Correo Electrónico</span>
                        <p class="valor-campo" th:text="${cliente.email}"></p>
                    </div>

                    <div class="bloque-informacion">
                        <span class="etiqueta-campo">Fecha de Registro</span>
                        <p class="valor-campo" th:text="${#dates.format(cliente.createAt, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                </div>
            </div>
        </div>

        <p class="nota-pie">Sistema de Consulta de Clientes &bull; Spring Boot & Thymeleaf</p>
    </div>
</body>

</html>
